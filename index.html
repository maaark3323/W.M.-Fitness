<!DOCTYPE html>
<html lang="sk" style="background:#000">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest-v2.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FITCENTRUM W.M.">

<style>
html,body{overscroll-behavior:none}
#wmauth{position:fixed;inset:0;z-index:9999;color:#fff;font-family:"Manrope",system-ui,sans-serif;overflow:hidden;background:radial-gradient(120% 70% at 100% 0%,rgba(237,28,36,.38),transparent 60%),radial-gradient(90% 50% at 0% 100%,rgba(237,28,36,.16),transparent 60%),linear-gradient(170deg,#141416,#050506 65%);overscroll-behavior:none;touch-action:pan-x pan-y}
#wmauth[hidden]{display:none}
#wmauth::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-55deg,rgba(255,255,255,.035) 0 2px,transparent 2px 18px);-webkit-mask-image:linear-gradient(115deg,transparent 35%,#000 85%);mask-image:linear-gradient(115deg,transparent 35%,#000 85%);pointer-events:none}
#wmauth .wmk{position:absolute;right:-18px;top:calc(env(safe-area-inset-top) + 40px);font:400 190px/1 "Anton",sans-serif;color:transparent;-webkit-text-stroke:1.5px rgba(237,28,36,.22);pointer-events:none;animation:wmfl 7s ease-in-out infinite alternate}
@keyframes wmfl{to{transform:translateY(14px)}}
#wmauth .pane{position:absolute;inset:0;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 10px) 24px calc(env(safe-area-inset-bottom) + 26px);max-width:520px;margin:0 auto;transition:transform .45s cubic-bezier(.2,.9,.2,1),opacity .35s}
#wmauth.step2 .p1{transform:translateX(-30%);opacity:0;pointer-events:none}
#wmauth .p2{transform:translateX(100%);opacity:0;pointer-events:none}
#wmauth.step2 .p2{transform:none;opacity:1;pointer-events:auto}
#wmauth .wtop{display:flex;align-items:center;gap:10px}
#wmauth .wtop img{width:42px}
#wmauth .wtop b{font:900 19px/1 "Archivo",sans-serif;font-stretch:125%;letter-spacing:-.02em;white-space:nowrap}#wmauth .wtop b .cc{font-style:normal;display:inline-block;position:relative;z-index:1;margin-right:-.16em;-webkit-text-stroke:.09em #121214;paint-order:stroke fill}#wmauth .wtop b span{margin-left:.22em}
#wmauth .wtop b span{color:#ED1C24}
#wmauth .grow{flex:1}
#wmauth .eye{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;font:800 10.5px "Archivo",sans-serif;letter-spacing:.22em;text-transform:uppercase;color:#ff5a60;padding:6px 10px;border-radius:999px;background:rgba(237,28,36,.1);border:1px solid rgba(237,28,36,.3)}
#wmauth .eye i{width:7px;height:7px;border-radius:50%;background:#ED1C24;box-shadow:0 0 10px #ED1C24}
#wmauth h1{margin:16px 0 10px;font:400 62px/1.22 "Anton",sans-serif;text-transform:uppercase}
#wmauth h1 em{font-style:normal;color:#ED1C24;text-shadow:0 0 28px rgba(237,28,36,.45)}
#wmauth h2{margin:0 0 6px;font:400 44px/.95 "Anton",sans-serif;text-transform:uppercase}
#wmauth .sub{color:#b9bac0;font-size:15px;max-width:32ch;margin-bottom:28px}
#wmauth .p1 h1,#wmauth .p1 .sub,#wmauth .p1 .eye,#wmauth .p1 .btns{animation:wmup .8s cubic-bezier(.16,.9,.2,1) both}
#wmauth .p1 h1{animation-delay:.08s}#wmauth .p1 .sub{animation-delay:.16s}#wmauth .p1 .btns{animation-delay:.24s}
@keyframes wmup{from{opacity:0;transform:translateY(22px)}}
#wmauth .btns{display:flex;flex-direction:column;gap:12px}
#wmauth button{font:800 15px "Archivo",sans-serif;letter-spacing:.14em;text-transform:uppercase;padding:18px;border-radius:16px;border:0;cursor:pointer;color:#fff;-webkit-tap-highlight-color:transparent;transition:transform .12s}
#wmauth button:active{transform:scale(.97)}
#wmauth .pri{background:linear-gradient(180deg,#ff3a41,#d4141b);box-shadow:0 10px 30px rgba(237,28,36,.4),inset 0 1px 0 rgba(255,255,255,.25)}
#wmauth .sec{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(8px)}
#wmauth .back{align-self:flex-start;width:44px;height:44px;padding:0;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);font-size:20px;letter-spacing:0;margin-bottom:26px}
#wmauth form{display:flex;flex-direction:column;gap:12px}
#wmauth label{font:700 11px "Archivo",sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#94959A;margin:6px 0 -4px 4px}
#wmauth input{font:600 17px "Manrope",sans-serif;padding:16px;border-radius:16px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:#fff;outline:none;transition:border-color .2s,background .2s}
#wmauth input:focus{border-color:#ED1C24;background:rgba(237,28,36,.06)}
#wmauth form .pri{margin-top:10px}
#wmauth .msg{min-height:20px;text-align:center;font-size:14px;color:#ff8a8f}
#wmauth .msg.ok{color:#8fe3a0}
#wmauth .lnk{background:none;box-shadow:none;color:#94959A;font:600 14px "Manrope",sans-serif;letter-spacing:0;text-transform:none;padding:6px}
#wmauth .lnk[hidden]{display:none}
</style>
<script>
/* ===== WM fitness: Supabase backend (napodobňuje pôvodné API úložiska) ===== */
const WM_SB_URL="https://jzqbplzafhogzkbyrdgt.supabase.co";
const WM_SB_KEY="sb_publishable_GoKrhuP_NC9njRhZcyVkoQ_dGhe5CQL";
const WMAuth=(()=>{
  let sb=null,session=null,pending=0;const live=new Set();
  const fail=e=>{const m=(e&&e.message)||"chyba";const x=new Error(m);x.code=/fetch|network|timeout|Load failed/i.test(m)?"unavailable":(e&&e.code)||"error";return x};
  const snap=rows=>({docs:rows.map(r=>({id:r.id,exists:true,data:()=>r.data})),metadata:{fromCache:false}});
  async function track(p){pending++;try{return await p}finally{pending--}}
  class Coll{constructor(p){this.p=p}
    doc(id){return new Doc(this.p+"/"+id)}
    async get(){const {data,error}=await sb.from("docs").select("id,data").eq("parent",this.p);if(error)throw fail(error);return snap(data||[])}
    onSnapshot(cb,ecb){const run=()=>this.get().then(cb,e=>ecb&&ecb(e));run();live.add(run);return()=>live.delete(run)}}
  class Doc{constructor(p){this.p=p;const i=p.lastIndexOf("/");this.parent=p.slice(0,i);this.id=p.slice(i+1)}
    collection(n){return new Coll(this.p+"/"+n)}
    async get(){const {data,error}=await sb.from("docs").select("data").eq("path",this.p).maybeSingle();if(error)throw fail(error);return{exists:!!data,id:this.id,data:()=>data?data.data:undefined}}
    set(v){return track((async()=>{const {error}=await sb.from("docs").upsert({path:this.p,parent:this.parent,id:this.id,data:JSON.parse(JSON.stringify(v??{})),updated_at:new Date().toISOString()});if(error)throw fail(error)})())}
    delete(){return track((async()=>{const {error}=await sb.from("docs").delete().eq("path",this.p);if(error)throw fail(error)})())}}
  const db={doc:p=>new Doc(p),collection:p=>new Coll(p)};
  const user={id:async()=>session.user.id,isOwner:async()=>{try{const {data}=await sb.rpc("is_admin");return !!data}catch(e){return false}},can:async()=>true,email:()=>session&&session.user.email};
  /* obnov dáta, keď sa appka vráti na obrazovku (iba ak sa práve nič neukladá) */
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&session&&!pending)live.forEach(f=>f())});
  function boot(){try{if(location.hash!=="#trening")history.replaceState(null,"","#trening")}catch(e){}window.claude={use:async n=>n==="db"?db:n==="user"?user:null};document.getElementById("wmauth").hidden=true;Store.init()}
  function ui(){
    const el=document.getElementById("wmauth"),f=el.querySelector("form"),msg=el.querySelector(".msg"),em=f.querySelector("[name=email]"),pw=f.querySelector("[name=pw]");
    const say=(t,ok)=>{msg.textContent=t;msg.className="msg"+(ok?" ok":"")};
    const tr=e=>{const m=(e&&e.message)||"";if(/Invalid login/i.test(m))return"Nesprávny email alebo heslo.";if(/already registered/i.test(m))return"Tento email už má účet – prihlás sa.";if(/at least 6|Password should/i.test(m))return"Heslo musí mať aspoň 6 znakov.";if(/not confirmed/i.test(m))return"Najprv potvrď email (odkaz v pošte).";if(/fetch|network/i.test(m))return"Nie si pripojený na internet.";return m||"Niečo sa pokazilo."};
    let mode="login";
    const T={login:["Vitaj späť","Prihlás sa a pokračuj tam, kde si skončil.","Prihlásiť sa","current-password"],reg:["Nový účet","Stačí email a heslo. Tréningy uvidíš len ty.","Vytvoriť účet","new-password"]};
    const go=m=>{mode=m;const t=T[m];el.querySelector("[data-t]").textContent=t[0];el.querySelector("[data-s]").textContent=t[1];el.querySelector("[data-b]").textContent=t[2];pw.autocomplete=t[3];pw.placeholder=m==="reg"?"aspoň 6 znakov":"";el.querySelector("[data-reset]").hidden=m!=="login";say("");el.classList.add("step2");setTimeout(()=>em.focus(),380)};
    el.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
    el.querySelector(".back").onclick=()=>{el.classList.remove("step2");document.activeElement&&document.activeElement.blur()};
    el.hidden=false;
    f.onsubmit=async e=>{e.preventDefault();const E=em.value.trim(),P=pw.value;
      if(mode==="login"){say("Prihlasujem…",true);const {data,error}=await sb.auth.signInWithPassword({email:E,password:P});if(error)return say(tr(error));session=data.session;return boot()}
      say("Vytváram účet…",true);const {data,error}=await sb.auth.signUp({email:E,password:P,options:{emailRedirectTo:location.origin+location.pathname}});if(error)return say(tr(error));
      if(data.session){session=data.session;boot()}else say("Účet vytvorený. Potvrď ho cez odkaz v emaile a potom sa prihlás.",true)};
    el.querySelector("[data-reset]").onclick=async()=>{if(!em.value.trim())return say("Najprv napíš svoj email.");const {error}=await sb.auth.resetPasswordForEmail(em.value.trim(),{redirectTo:location.origin+location.pathname});say(error?tr(error):"Poslal som ti email na zmenu hesla.",!error)};
  }
  return{
    async start(){
      if(!window.supabase){document.getElementById("wmauth").hidden=false;document.querySelector("#wmauth .msg").textContent="Nepodarilo sa načítať appku. Skontroluj internet a obnov stránku.";return}
      sb=window.supabase.createClient(WM_SB_URL,WM_SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
      sb.auth.onAuthStateChange(async(ev,s)=>{if(ev==="PASSWORD_RECOVERY"){const np=prompt("Zadaj nové heslo (aspoň 6 znakov):");if(np){const {error}=await sb.auth.updateUser({password:np});alert(error?"Heslo sa nepodarilo zmeniť.":"Heslo zmenené.")}}if(s)session=s});
      const {data}=await sb.auth.getSession();session=data.session;
      if(session)boot();else ui()},
    email(){return session&&session.user.email},
    async logout(){try{await sb.auth.signOut()}catch(e){}try{localStorage.removeItem("gymlog.v1")}catch(e){}location.reload()}
  }})();
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>

<style>
/* Layout: one-column dark mobile app (max 560px), sticky top bar, floating bottom nav, rounded bottom sheets. Soft modern take on the gym look: deep graphite, muted coral-red, rounded surfaces. */
:root{
  --bg:#000000; --surface:#0C0C0D; --soft:#18181A; --ink:#F2F2F3; --muted:#94959A; --line:#202022;
  --accent:#ED1C24; --accent-ink:#FFFFFF; --accent-soft:rgba(237,28,36,.16); --good:#4CC38A; --good-soft:rgba(76,195,138,.13);
  --display:"Unbounded",system-ui,sans-serif; --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;transition:background .15s,transform .1s}
button:active:not(:disabled){transform:scale(.97)}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font:600 26px/1.15 var(--display);letter-spacing:-.03em}
h2{font:700 17px/1.3 var(--body);letter-spacing:-.01em}
h3,.label{font:700 12px/1.3 var(--body);color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.tab{font-variant-numeric:tabular-nums}
.app{max-width:560px;margin:0 auto;padding:0 16px calc(110px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 0 12px;margin-bottom:8px}
.brand{font:600 17px var(--display);letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.brand span{color:var(--accent)}
.brand .mark{width:24px;height:24px;border-radius:8px;background:var(--accent)}

  const one=(d,lab)=>{const v=d.vb.split(" ").map(Number),cx=v[0]+v[2]/2;return `<svg viewBox="${d.vb}" role="img" aria-label="${lab}"><g transform="translate(${cx} 0) scale(0.94 1) translate(${-cx} 0)"><path d="${d.base}" fill="${lt?"#E4E4E8":"#141417"}" stroke="${lt?"#C9C9CF":"#34343A"}" stroke-width="3" stroke-linejoin="round"/>${d.regs.map(([k,p])=>{const val=mus[k]||0,l=lvOf(val/weeks);return `<path class="mu2 ${l===5?"gold":""}" d="${p}" fill="${l?LV[l][1]:(lt?"#F6F6F8":"#1C1C21")}" stroke="${lt?"#E4E4E8":"#000"}" stroke-width="2.4" stroke-linejoin="round" data-act="mus" data-v="${k}" data-s="${val}" data-w="${weeks}"><title>${k}</title></path>`}).join("")}</g></svg>`};
  const G=S.settings.sex==="f"?FIGF:FIG;return `<div class="body2"><figure>${one(G.front,"Predná strana tela")}<figcaption>PREDOK</figcaption></figure><figure>${one(G.back,"Zadná strana tela")}<figcaption>CHRBÁT</figcaption></figure></div>`}
function legend(){return `<div class="legend">${LV.slice(1).map(([n,c],i)=>`<span><i style="background:${c}"></i>${i+1}. úroveň<br><b style="color:var(--ink)">${LV_T[i]}+</b></span>`).join("")}</div><div class="sub" style="text-align:center">sérií na sval za týždeň · ťukni na sval</div>`}
function radarSVG(cur,prev){const ax=[["Chrbát",["Chrbát"]],["Hrudník",["Hrudník"]],["Brucho",["Brucho"]],["Ramená",["Ramená"]],["Ruky",["Biceps","Triceps","Predlaktie"]],["Nohy",["Kvadricepsy","Hamstringy","Zadok","Lýtka","Adduktory/abduktory"]]];
  const val=o=>ax.map(([,ks])=>ks.reduce((s,k)=>s+((o||{})[k]||0),0)),share=v=>{const t=v.reduce((a,b)=>a+b,0)||1;return v.map(x=>x/t)};
  const a=val(cur),sa=share(a),b=prev?share(val(prev)):null,mx=Math.max(.0001,...sa,...(b||[]));
  const cx=160,cy=140,R=92,pt=(i,v)=>{const g=-Math.PI/2+i*Math.PI/3;return[(cx+Math.cos(g)*R*v).toFixed(1),(cy+Math.sin(g)*R*v).toFixed(1)]};
  const sc=v=>.16+.84*(v/mx),poly=vs=>vs.map((v,i)=>pt(i,sc(v)).join(",")).join(" ");
  let g="";Array.from({length:9},(_,q)=>1-q/9).forEach((r,j)=>{g+=`<polygon points="${ax.map((_,i)=>pt(i,r).join(",")).join(" ")}" fill="${S.settings.theme==="light"?(j%2?"#FFFFFF":"#F3F3F5"):(j%2?"#0B0B0D":"#111114")}" stroke="${S.settings.theme==="light"?(j%3===0?"#D6D6DB":"#E6E6EA"):(j%3===0?"#2C2C32":"#1E1E22")}"/>`});
  ax.forEach((_,i)=>{const[x,y]=pt(i,1);g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)"/>`});
  const lab=ax.map(([n],i)=>{const[x,y]=pt(i,1.24);return `<text x="${x}" y="${+y-3}" font-size="12.5" font-weight="700" fill="var(--ink)" text-anchor="middle">${n}</text><text x="${x}" y="${+y+12}" font-size="11" fill="${sa[i]?"#ED1C24":"var(--muted)"}" font-weight="700" text-anchor="middle">${Math.round(sa[i]*100)} %</text>`}).join("");
  return `<svg viewBox="0 0 320 290" class="chart" role="img" aria-label="Rozloženie tréningu podľa partií"><defs><radialGradient id="rgf" cx="50%" cy="50%" r="60%"><stop offset="0" stop-color="#ED1C24" stop-opacity=".65"/><stop offset="1" stop-color="#ED1C24" stop-opacity=".22"/></radialGradient></defs>${g}
    ${b?`<polygon points="${poly(b)}" fill="rgba(255,255,255,.06)" stroke="#8A8A92" stroke-dasharray="4 3" stroke-width="1" stroke-linejoin="round"/>`:""}
    <polygon points="${poly(sa)}" fill="url(#rgf)" stroke="#ED1C24" stroke-width="1.3" stroke-linejoin="round"/>
    ${lab}</svg>
    <div class="row" style="justify-content:center;gap:16px;font-size:12px;color:var(--muted)"><span><i style="display:inline-block;width:12px;height:12px;background:#ED1C24;opacity:.7;vertical-align:-2px;margin-right:5px"></i>Toto obdobie</span>${b?`<span><i style="display:inline-block;width:12px;height:0;border-top:2px dashed #8A8A92;vertical-align:3px;margin-right:5px"></i>Predchádzajúce</span>`:""}</div>`}
function musBars(obj,fmt,prev){const all=MUSCLES.filter(m=>!["Iné","Celé telo"].includes(m)||obj[m]).map(m=>[m,obj[m]||0]).sort((a,b)=>b[1]-a[1]);const mx=Math.max(1e-9,...all.map(x=>x[1]));
  const list=S.ui.allMus?all:all.slice(0,5);
  return `<div class="bars">${list.map(([k,v])=>`<div class="bar" data-k="${esc(k)}"><span>${esc(k)}</span><span class="tr"><i style="width:${v?Math.max(3,v/mx*100):0}%"></i></span><span class="v"><b>${fmt(v)}</b>${prev?delta(v,prev[k]||0):""}</span></div>`).join("")}</div>
  <button class="btn sm ghost" data-act="allmus">${S.ui.allMus?"Zobraziť menej":`Načítať viac (${all.length-5})`}</button>`}
function viewStats(){const [f,t,pf,pt]=rangeBounds(),cur=aggregate(workoutsIn(f,t)),prev=pf!=null?aggregate(workoutsIn(pf,pt)):null;const metric=S.ui.smetric||"sets";
  const ranges=[[7,"7 dní"],[30,"30 dní"],[90,"3 mes."],[365,"Rok"],["all","Všetko"]];

  return `<div class="segc">${ranges.map(([v,l])=>`<button class="${String(S.ui.range)===String(v)?"on":""}" data-act="range" data-v="${v}">${l}</button>`).join("")}</div>
  <div class="ptc" data-anim="stats"><div class="grid2"><div class="tile"><b>${cur.n}${prev?delta(cur.n,prev.n):""}</b><span>tréningov</span></div><div class="tile"><b>${fmtHours(cur.dur)}${prev?delta(cur.dur,prev.dur):""}</b><span>čas</span></div>
   <div class="tile"><b>${fmtN(Math.round(cur.vol))} kg${prev?delta(cur.vol,prev.vol):""}</b><span>objem</span></div><div class="tile"><b>${cur.sets}${prev?delta(cur.sets,prev.sets):""}</b><span>sérií</span></div></div>
  <div class="card" style="display:flex;flex-direction:column;gap:10px"><span class="label">Odtrénované svaly</span>${bodySVG(cur.mus,rangeWeeks(f,t))}${legend()}</div>
  <div class="card" style="display:flex;flex-direction:column;gap:6px"><span class="label">Rozloženie tréningu</span>${radarSVG(cur.mus,prev&&prev.mus)}</div>
  <div class="card" style="display:flex;flex-direction:column;gap:10px"><span class="label">Podľa svalov</span>
    <div class="segc"><button class="${metric==="sets"?"on":""}" data-act="smetric" data-v="sets">Série</button><button class="${metric==="vol"?"on":""}" data-act="smetric" data-v="vol">Objem</button></div>
    <div data-anim="bars">${metric==="sets"?musBars(cur.mus,v=>fmtN(Math.round(v*10)/10),prev&&prev.mus):musBars(cur.vmus,v=>v?fmtN(Math.round(v/100)/10)+" t":"0",prev&&prev.vmus)}</div></div>
  <div class="card"><span class="label">Hlavné cviky</span>${top.length?top.map(([mid,n])=>{const m=S.machines[mid]||{name:"?"};return `<button class="mrow" data-act="m-open" data-id="${mid}">${thumb(m,"sm")}<span class="mcol"><b>${esc(m.name)}</b><span class="tr" style="display:block;height:6px;border-radius:999px;background:var(--soft);margin-top:6px"><i style="display:block;height:100%;width:${n/mxe*100}%;background:var(--accent);border-radius:999px"></i></span></span><span class="last">${n} sérií</span></button>`}).join(""):`<div class="sub" style="margin-top:8px">Zatiaľ žiadne dáta.</div>`}</div></div>`}
/* calendar */
function viewCalendar(){const now=new Date();if(!S.ui.cal)S.ui.cal={y:now.getFullYear(),m:now.getMonth(),sel:dayKey(Date.now()),yr:now.getFullYear()};const c=S.ui.cal;
  const byDay={};for(const w of sortedWorkouts()){const k=dayKey(w.start);(byDay[k]=byDay[k]||[]).unshift(w)}
  const first=new Date(c.y,c.m,1),off=(first.getDay()-S.settings.weekStart+7)%7,dim=new Date(c.y,c.m+1,0).getDate();
  const names=S.settings.weekStart===1?["Po","Ut","St","Št","Pi","So","Ne"]:["Ne","Po","Ut","St","Št","Pi","So"];
  let cells=names.map(n=>`<div class="dh">${n}</div>`).join("");for(let i=0;i<off;i++)cells+=`<div></div>`;
  for(let d=1;d<=dim;d++){const k=dayKey(new Date(c.y,c.m,d).getTime()),ws=byDay[k];
    cells+=`<button class="${ws?"has":""} ${k===dayKey(Date.now())?"today":""} ${k===c.sel&&!ws?"sel":""}" ${ws?`data-act="w-open" data-id="${ws[0].id}"`:`data-act="cal-day" data-k="${k}"`}><span class="dn">${d}</span>${ws?`<span class="cw">${esc(ws[0].name)}</span>${ws.length>1?`<span class="cw2">+${ws.length-1}</span>`:""}`:""}</button>`}
  const ye=new Date(c.yr+1,0,1).getTime();let hm="";for(let mo=0;mo<12;mo++){const f=new Date(c.yr,mo,1),off=(f.getDay()-S.settings.weekStart+7)%7,dim=new Date(c.yr,mo+1,0).getDate();let cs="";for(let i=0;i<off;i++)cs+=`<i class="no"></i>`;for(let d=1;d<=dim;d++){const k=dayKey(new Date(c.yr,mo,d).getTime());cs+=`<i class="${byDay[k]?"on":""}${k===dayKey(Date.now())?" td":""}"></i>`}hm+=`<div class="ym"><b>${esc(f.toLocaleDateString(LOC(),{month:"short"}))}</b><div class="ymg">${cs}</div></div>`}
  const yw=workoutsIn(new Date(c.yr,0,1).getTime(),ye).length,mw=workoutsIn(first.getTime(),new Date(c.y,c.m+1,1).getTime()).length;
  return `<div class="card" data-anim="cal" style="display:flex;flex-direction:column;gap:10px"><div class="row between"><button class="icon" data-act="cal-mv" data-v="-1" aria-label="Predchádzajúci mesiac">‹</button><button class="calhd" data-act="cal-pick" aria-label="Vybrať mesiac a rok"><div class="calt" id="calt"><b style="text-transform:capitalize">${esc(first.toLocaleDateString(LOC(),{month:"long",year:"numeric"}))}<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></b><div class="sub">${mw} ${mw===1?"tréning":"tréningov"}</div></div></button><button class="icon" data-act="cal-mv" data-v="1" aria-label="Ďalší mesiac">›</button></div>
    <div class="calclip"><div class="cal" id="calg">${cells}</div></div>
    <div class="sub" style="text-align:center">Ťukni na tréning a zobrazí sa jeho detail.</div></div>
  <div class="grid2"><div class="tile"><b>${streakNow()}</b><span>aktuálna séria týždňov</span></div><div class="tile"><b>${streakMax()}</b><span>najdlhšia séria</span></div></div>
  <div class="card" data-anim="yr" style="display:flex;flex-direction:column;gap:10px"><div class="row between"><button class="icon" data-act="cal-yr" data-v="-1" aria-label="Predchádzajúci rok">‹</button><b>${c.yr} · ${yw} tréningov</b><button class="icon" data-act="cal-yr" data-v="1" aria-label="Ďalší rok">›</button></div><div class="yr12">${hm}</div></div>`}
function calSwap(cls){const t=document.createElement("div");t.innerHTML=viewCalendar();const nt=t.querySelector("#calt"),ng=t.querySelector("#calg"),ot=$("#calt"),og=$("#calg");if(!(nt&&ng&&ot&&og)){render(true);return}
  const card=og.closest(".card"),h0=card.offsetHeight;ot.replaceWith(nt);og.replaceWith(ng);for(const e of[nt,ng]){e.classList.add(cls)}

function calPickInner(){const y=S.ui.cpy,c=S.ui.cal,now=new Date();return `<div class="row between"><button class="icon" data-act="cp-y" data-v="-1" aria-label="Predchádzajúci rok">‹</button><b style="font-size:18px">${y}</b><button class="icon" data-act="cp-y" data-v="1" aria-label="Ďalší rok">›</button></div>

function parseImport(text){const out=[];const lines=String(text).split(/\r?\n/).map(l=>l.trim()).filter(Boolean);

    else{const mm=l.match(/^#?(\d+[a-zA-Z]?)[\s.\-–:)]+(.+)$/);if(mm){num=mm[1];name=mm[2]}else name=l}

function exportCSV(){const rows=[["datum","trening","trvanie_min","cvik","cislo_stroja","typ_serie","vaha_alebo_min","opakovania_alebo_km","rpe","poznamka"]];
  for(const w of [...sortedWorkouts()].reverse())for(const ex of w.exercises){const m=S.machines[ex.mid]||{name:"?"};for(const s of ex.sets)rows.push([new Date(w.start).toISOString().slice(0,16).replace("T"," "),w.name,Math.round(durOf(w)/60000),m.name,m.num||"",s.t,s.a??"",s.b??"",s.rpe??"",ex.note||""])}

function parseCSV(t){const fl=t.split("\n")[0];const sep=(fl.match(/;/g)||[]).length>(fl.match(/,/g)||[]).length?";":",";const rows=[];let row=[],f="",q=false;

  if(I.date<0||I.ex<0){toast("Toto nevyzerá ako export zo Strong (chýba Date / Exercise Name).");return}

function playEnd(){if(!S.settings.sound||!AC)return;const k=S.settings.tone||"beep",v=.35*S.settings.vol,t0=AC.currentTime;
  const note=(f,t,d,type,g)=>{const o=AC.createOscillator(),gn=AC.createGain();o.type=type||"sine";o.frequency.value=f;gn.gain.setValueAtTime(.0001,t0+t);gn.gain.exponentialRampToValueAtTime(Math.max(.0002,v*(g||1)),t0+t+.01);gn.gain.exponentialRampToValueAtTime(.0001,t0+t+d);o.connect(gn);gn.connect(AC.destination);o.start(t0+t);o.stop(t0+t+d+.05)};
  const loud=(f,t,d,type,g,f2)=>{const o=AC.createOscillator(),gn=AC.createGain(),cp=AC.createDynamicsCompressor();cp.threshold.value=-30;cp.ratio.value=8;o.type=type||"sine";o.frequency.setValueAtTime(f,t0+t);if(f2)o.frequency.linearRampToValueAtTime(f2,t0+t+d);gn.gain.setValueAtTime(.0001,t0+t);gn.gain.exponentialRampToValueAtTime(Math.min(1,Math.max(.0002,v*2.4*(g||1))),t0+t+.008);gn.gain.exponentialRampToValueAtTime(.0001,t0+t+d);o.connect(gn);gn.connect(cp);cp.connect(AC.destination);o.start(t0+t);o.stop(t0+t+d+.05)};
  try{if(k==="ring")[0,.28,.56].forEach(t=>{[[523,1,1.6],[1310,.7,1.2],[2290,.45,.9],[3340,.3,.6],[4200,.2,.4]].forEach(([f,g,d])=>loud(f,t,d,"sine",g))});
    else if(k==="horn"){[[233,0],[277,0],[349,0]].forEach(([f])=>loud(f,0,1.3,"sawtooth",.55));[[233,1.45],[277,1.45],[349,1.45]].forEach(([f,t])=>loud(f,t,.6,"sawtooth",.55))}
    else if(k==="whistle"){for(let i=0;i<14;i++)loud(i%2?2900:3150,i*.045,.05,"sine",.9);for(let i=0;i<10;i++)loud(i%2?2900:3150,.9+i*.045,.05,"sine",.9)}
    else if(k==="alarm")for(let i=0;i<4;i++)loud(i%2?1280:960,i*.18,.16,"square",.5);
    else if(k==="bell")[0,.4].forEach(t=>{note(1318.5,t,1.2);note(1975.5,t,.8,"sine",.3);note(2637,t,.5,"sine",.2)});

    else if(k==="buzz")[0,.3,.6].forEach(t=>note(220,t,.22,"sawtooth",.35));
    else[0,.2,.4].forEach((t,i)=>note(i===2?1175:880,t,.14,"square",.45))}catch(e){}}

function plateCalc(target){const bar=S.settings.bar===""||S.settings.bar==null||isNaN(+S.settings.bar)?20:+S.settings.bar,plates=String(S.settings.plates).split(/[,;\s]+/).map(parseNum).filter(x=>x>0).sort((a,b)=>b-a);let side=(target-bar)/2;const out=[];
  if(side<0)return{out,rest:side,bar};for(const p of plates){while(side>=p-1e-9){out.push(p);side=Math.round((side-p)*1000)/1000}}return{out,rest:side,bar}}

  const col=p=>p>=25?"#ED1C24":p>=20?"#3D7BE0":p>=15?"#F5B14C":p>=10?"#4CC38A":p>=5?"#E8EAED":"#8C929B";

function doSave(updRoutine){const a=S.active,w=clone(a);const dur=S.fin.dur;
  w.dur=dur;w.end=w.start+dur;w.note=S.fin.note??(a.note||"");w.photos=S.fin.photos;
  w.exercises=w.exercises.map(ex=>({...ex,sets:ex.sets.filter(validSet).map(s=>{const c={...s,done:true};delete c.pw;delete c.prr;return c})})).filter(ex=>ex.sets.length);
  if(!w.exercises.length){toast("Tréning nemá žiadnu vyplnenú sériu.");return}
  const id=a.editOf||a.id;w.id=id;delete w.editOf;delete w.pauseAt;delete w.pausedMs;delete w.past;
  const prList=[];for(const ex of w.exercises){const kind=(S.machines[ex.mid]||{}).kind||"kg";const cur=bestOf(ex.sets,kind).score;let prev=0;for(const x of machineHistory(ex.mid,id))if(x.w.start<w.start)prev=Math.max(prev,bestOf(x.ex.sets,kind).score);if(prev>0&&cur>prev&&!prList.includes(ex.mid))prList.push(ex.mid)}
  w.prList=prList;w.prs=prList.length;Store.saveWorkout(w);
  const rr=updRoutine&&w.rid?S.routines.find(x=>x.id===w.rid):null;
  if(rr){rr.items=a.exercises.filter(ex=>S.machines[ex.mid]).map(ex=>{const o=rr.items.find(i=>i.mid===ex.mid)||{};return{mid:ex.mid,sets:ex.sets.filter(s=>s.t!=="w").length||1,reps:o.reps||"",w:o.w??null,rest:ex.rest??o.rest??null,note:o.note||"",ss:ex.ss||null}});S.routines=[...S.routines];Store.saveRoutines()}
  const wasEdit=!!a.editOf;S.active=null;Store.saveActive(true);T.end=0;SW=null;closeSheet();render(true);
  if(wasEdit){toast("Tréning upravený");return}
  const num=sortedWorkouts().filter(x=>x.start<=w.start).length;
  S.ctx={wid:w.id,share:workoutText(w)};tone([660,880,1100],.12,"prVol");
  openSheet(`${head("Skvelá práca!")}<div class="sheet-b"><div style="text-align:center"><div class="label">Tréning č.</div><div style="font:600 44px var(--display);color:var(--accent)">${num}</div><div class="sub">${streakNow()} ${streakNow()===1?"týždeň":"týždňov"} v rade${rr?" · rutina aktualizovaná":""}</div></div>

    ${prList.length?`<div class="card">${prList.map(id=>`<div style="padding:3px 0"><span class="pr" style="margin:0 6px 0 0">PR</span>${esc((S.machines[id]||{}).name)}</div>`).join("")}</div>`:""}

/* ================= rest timer & stopwatch ================= */
const T={end:0,total:0,beeped:true};
function startRest(sec,label){if(!(sec>0))return;T.total=sec;T.end=Date.now()+sec*1000;T.beeped=false;T.label=label||"pauza";T.free=!!label;tick()}
function tick(){const w=S.active;const c=$("#clock");if(c&&w)c.textContent=clock(elapsed(w));wbSync();const pc=$("#pclock");if(pc&&w)pc.textContent=clock(elapsed(w));const sw=$("#sw");if(sw&&SW)sw.textContent=clock(Date.now()-SW.start);
  const el=$("#timer");if(!T.end||(!w&&!T.free)){el.hidden=true;return}const left=(T.end-Date.now())/1000;
  if(left<=0&&!T.beeped){T.beeped=true;playEnd();buzz([180,90,180])}if(left<-30){T.end=0;el.hidden=true;return}
  el.hidden=false;el.classList.toggle("over",left<=0);
  if(!el.firstChild)el.innerHTML=`<div class="in"><span class="t" id="tt" data-act="wbar-go"></span><span class="grow sub" style="color:inherit;opacity:.75" id="tl" data-act="wbar-go"></span><button data-act="t-minus">−15</button><button data-act="t-plus">+15</button><button data-act="t-skip">Ďalej</button><div class="bar" id="tb"></div></div>`;
  $("#tt").textContent=left>0?clock(left*1000+999):"0:00";$("#tl").textContent=left>0?(T.label||"pauza"):(T.free?"Čas vypršal!":"Ďalšia séria!");$("#tb").style.transform=`scaleX(${Math.max(0,Math.min(1,left/T.total)).toFixed(4)})`}
setInterval(tick,500);

let swp=null;
document.addEventListener("touchstart",e=>{const r=e.target.closest&&e.target.closest(".srow");if(!r||e.target.tagName==="INPUT")return;const t=e.touches[0];swp={r,x:t.clientX,y:t.clientY,dx:0,lock:null}},{passive:true});
document.addEventListener("touchmove",e=>{if(!swp)return;const t=e.touches[0],dx=t.clientX-swp.x,dy=t.clientY-swp.y;if(swp.lock==null&&(Math.abs(dx)>8||Math.abs(dy)>8))swp.lock=Math.abs(dx)>Math.abs(dy)?"x":"y";if(swp.lock!=="x")return;swp.dx=Math.min(0,dx);swp.r.style.transform=`translateX(${swp.dx}px)`;swp.r.style.background=swp.dx<-90?"rgba(237,28,36,.25)":""},{passive:true});
document.addEventListener("touchend",()=>{if(!swp)return;const {r,dx}=swp;swp=null;if(dx<-90&&S.active){const ex=S.active.exercises[r.dataset.ei];ex.sets.splice(+r.dataset.si,1);Store.saveActive();render(true);toast("Séria odstránená")}else{r.style.transform="";r.style.background=""}});

/* ================= drag to reorder exercises ================= */
let dg=null,lp=null,dgSwallow=false;
const dgScroll=()=>dg&&dg.sc?dg.sc.scrollTop:window.scrollY;
function dgStart(card,y,kind){const sel=kind==="ex"?"#view .ex":"#sheetBody .ritem";const cards=[...document.querySelectorAll(sel)];const sc=kind==="ex"?null:card.closest(".sheet-b");
  dg={kind,sc,card,ei:+(kind==="ex"?card.dataset.ei:card.dataset.i),y0:y,cards,rects:cards.map(c=>c.getBoundingClientRect()),y};dg.st0=dgScroll();dg.to=dg.ei;card.classList.add("dragging");document.body.classList.add("dragmode");buzz(25);dgLoop()}
function dgMove(y){if(!dg)return;dg.y=y;const dy=y-dg.y0+(dgScroll()-dg.st0);dg.card.style.transform=`translateY(${dy}px) scale(1.02)`;
  const R=dg.rects,me=R[dg.ei],mid=me.top+me.height/2+dy;let to=dg.ei;R.forEach((r,i)=>{if(i<dg.ei&&mid<r.top+r.height/2)to=Math.min(to,i);if(i>dg.ei&&mid>r.top+r.height/2)to=Math.max(to,i)});
  if(to!==dg.to){dg.to=to;buzz(8)}const hgt=me.height+(dg.kind==="ex"?14:12);dg.cards.forEach((c,i)=>{if(i===dg.ei)return;let s=0;if(dg.ei<to&&i>dg.ei&&i<=to)s=-hgt;if(dg.ei>to&&i<dg.ei&&i>=to)s=hgt;c.style.transform=s?`translateY(${s}px)`:""})}
function dgLoop(){if(!dg)return;const y=dg.y;let top=130,bot=window.innerHeight-170;if(dg.sc){const r=dg.sc.getBoundingClientRect();top=r.top+60;bot=r.bottom-60}
  const sp=y<top?-Math.ceil((top-y)/10):y>bot?Math.ceil((y-bot)/10):0;if(sp){if(dg.sc)dg.sc.scrollTop+=sp;else window.scrollBy(0,sp)}dgMove(dg.y);requestAnimationFrame(dgLoop)}
function dgEnd(){if(!dg)return;const{ei,to,kind,sc}=dg;dg.cards.forEach(c=>{c.style.transform="";c.classList.remove("dragging")});document.body.classList.remove("dragmode");dg=null;dgSwallow=true;setTimeout(()=>dgSwallow=false,350);
  if(kind==="ex"){if(to!==ei&&S.active){const a=S.active.exercises;const[x]=a.splice(ei,1);a.splice(to,0,x);Store.saveActive()}render(true)}
  else{const st=sc?sc.scrollTop:0;syncRE();if(to!==ei){const a=S.redit.items;const[x]=a.splice(ei,1);a.splice(to,0,x)}routineEditor();const nb=document.querySelector("#sheetBody .sheet-b");if(nb)nb.scrollTop=st}}
function lpBegin(target,x,y){if(!target.closest)return;let card=target.closest("#view .ex"),kind="ex";if(!card){card=target.closest("#sheetBody .ritem");kind="ri"}if(!card||(kind==="ex"&&!S.active))return;
  if(target.closest("input,textarea,select,.srow,.addset,[data-act=exmenu],[data-act=ex-rest],[data-act=r-rm]"))return;lp={x,y,tm:setTimeout(()=>{lp=null;dgStart(card,y,kind)},380)}}
function lpCancel(){if(lp){clearTimeout(lp.tm);lp=null}}
document.addEventListener("touchstart",e=>{const t=e.touches[0];lpBegin(e.target,t.clientX,t.clientY)},{passive:true});
document.addEventListener("touchmove",e=>{const t=e.touches[0];if(lp&&Math.hypot(t.clientX-lp.x,t.clientY-lp.y)>8)lpCancel();if(dg){e.preventDefault();dg.y=t.clientY}},{passive:false});
document.addEventListener("touchend",()=>{lpCancel();dgEnd()});document.addEventListener("touchcancel",()=>{lpCancel();dgEnd()});
document.addEventListener("mousedown",e=>{if(e.button===0)lpBegin(e.target,e.clientX,e.clientY)});
document.addEventListener("mousemove",e=>{if(lp&&Math.hypot(e.clientX-lp.x,e.clientY-lp.y)>6)lpCancel();if(dg){e.preventDefault();dg.y=e.clientY}});
document.addEventListener("mouseup",()=>{lpCancel();dgEnd()});
document.addEventListener("click",e=>{if(dgSwallow){e.stopPropagation();e.preventDefault()}},true);
document.addEventListener("contextmenu",e=>{if(dg||lp)e.preventDefault()});

const I18N_RX=[[/^(\d[\d\s,]*) sérií$/,["$1 sets","$1 sérií","$1 Sätze","$1 serii"]],[/^(\d+) tréningov$/,["$1 workouts","$1 tréninků","$1 Trainings","$1 treningów"]],[/^(\d+) tréning$/,["$1 workout","$1 trénink","$1 Training","$1 trening"]],
  [/^(\d+)\. úroveň$/,["Level $1","$1. úroveň","Stufe $1","Poziom $1"]],[/^pauza (\d+) s$/,["rest $1 s","pauza $1 s","Pause $1 s","przerwa $1 s"]],[/^⏱ Pauza: (.+)$/,["⏱ Rest: $1","⏱ Pauza: $1","⏱ Pause: $1","⏱ Przerwa: $1"]],
  [/^Načítať viac \((\d+)\)$/,["Load more ($1)","Načíst více ($1)","Mehr laden ($1)","Pokaż więcej ($1)"]],[/^Pridať \((\d+)\)$/,["Add ($1)","Přidat ($1)","Hinzufügen ($1)","Dodaj ($1)"]],[/^Tréning (\S+)$/,["Workout $1","Trénink $1","Training $1","Trening $1"]],
  [/^priemer (.+)$/,["avg $1","průměr $1","Ø $1","średnio $1"]],[/^cieľ (.+)$/,["target $1","cíl $1","Ziel $1","cel $1"]],[/^(\d+) tréningov · (.+) spolu$/,["$1 workouts · $2 total","$1 tréninků · $2 celkem","$1 Trainings · $2 gesamt","$1 treningów · $2 łącznie"]]];
function trText(s){const L=S.settings.lang||"sk";if(L==="sk")return s;const t=s.trim();if(!t)return s;const i=LIDX[L];const e=I18N[t];if(e)return s.replace(t,e[i]);
  for(const [rx,out] of I18N_RX)if(rx.test(t))return s.replace(t,t.replace(rx,out[i-1]));return s}
let trBusy=false;
function trNode(root){const L=S.settings.lang||"sk";trBusy=true;try{
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentNode&&/^(SCRIPT|STYLE|TEXTAREA)$/.test(n.parentNode.nodeName)?2:1});let n;
  while(n=w.nextNode()){const base=n.__sk??n.nodeValue;n.__sk=base;const v=L==="sk"?base:trText(base);if(n.nodeValue!==v)n.nodeValue=v}
  if(root.querySelectorAll)root.querySelectorAll("[placeholder],[aria-label]").forEach(el=>{for(const a of["placeholder","aria-label"]){if(!el.hasAttribute(a))continue;const k="__sk_"+a;const base=el[k]??el.getAttribute(a);el[k]=base;const v=L==="sk"?base:trText(base);if(el.getAttribute(a)!==v)el.setAttribute(a,v)}})}finally{trBusy=false}}
const trObs=new MutationObserver(ms=>{if(trBusy||(S.settings.lang||"sk")==="sk")return;for(const m of ms)for(const nd of m.addedNodes){if(nd.nodeType===1)trNode(nd);else if(nd.nodeType===3&&nd.parentNode)trNode(nd.parentNode)}});
trObs.observe(document.body,{childList:true,subtree:true});
function applyLang(){trNode(document.body);document.documentElement.lang=S.settings.lang||"sk"}

  if(t.id==="wname"&&S.active){S.active.name=t.value;Store.saveActive();return}

  if(row&&t.dataset.f&&S.active){S.active.exercises[row.dataset.ei].sets[row.dataset.si][t.dataset.f]=parseNum(t.value);Store.saveActive();updateActiveMeta();return}
  if(t.dataset.f==="note"&&S.active){S.active.exercises[t.closest(".ex").dataset.ei].note=t.value;Store.saveActive();return}

function scrollToNextSS(ei){const exs=S.active.exercises,g=exs[ei].ss;if(!g||!S.settings.ssScroll)return;const idx=exs.map((x,i)=>i).filter(i=>exs[i].ss===g);const pos=idx.indexOf(ei);
  for(let k=1;k<=idx.length;k++){const j=idx[(pos+k)%idx.length];if(exs[j].sets.some(s=>!s.done)){setTimeout(()=>{const el=document.querySelector(`.ex[data-ei="${j}"]`);el&&el.scrollIntoView({behavior:"smooth",block:"center"})},80);return}}}
